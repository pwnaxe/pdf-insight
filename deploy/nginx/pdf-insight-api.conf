limit_req_zone $binary_remote_addr zone=pdf_insight:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pdf-insight-api.pixelhorizon.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdf-insight-api.pixelhorizon.dev;

    ssl_certificate /etc/letsencrypt/live/pdf-insight-api.pixelhorizon.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf-insight-api.pixelhorizon.dev/privkey.pem;

    client_max_body_size 11m;

    limit_req zone=pdf_insight burst=10;
    limit_req_status 429;

    # Same error shape as the API, for responses generated by nginx itself.
    error_page 429 = @rate_limited;
    error_page 413 = @file_too_large;

    location @rate_limited {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again in a few minutes."}}';
    }

    location @file_too_large {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"The file is too large. The maximum size is 10 MB."}}';
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
