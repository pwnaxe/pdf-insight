limit_req_zone $binary_remote_addr zone=pdf_insight:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pdf-insight-api.46-4-71-118.sslip.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pdf-insight-api.46-4-71-118.sslip.io;

    ssl_certificate /etc/letsencrypt/live/pdf-insight-api.46-4-71-118.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf-insight-api.46-4-71-118.sslip.io/privkey.pem;

    client_max_body_size 11m;

    limit_req zone=pdf_insight burst=10;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
